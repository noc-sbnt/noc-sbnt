name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar métricas e linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PA_TOKEN }}
          filename: github-metrics.svg
          
          # AQUI ESTÁ O SEGREDO: Tiramos o "header". 
          # Assim mantém os commits e repositórios, mas oculta a data de criação!
          base: activity, repositories
          
          plugin_languages: yes
          plugin_languages_details: percentage
          
          # Mantive o tema claro (light) igual ao da sua imagem, para combinar.
          config_theme: light
