name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar métricas e linguagens
        uses: lowlighter/metrics@latest
        with:
          # Utiliza o seu token pessoal para ler os repositórios privados
          token: ${{ secrets.PA_TOKEN }}
          
          # Nome do ficheiro que será guardado no repositório
          filename: github-metrics.svg
          
          # O que vai aparecer na imagem
          base: header, activity, repositories
          
          # Ativar o cartão de linguagens
          plugin_languages: yes
          plugin_languages_details: percentage
          
          # Tema escuro (opcional, combina com a cobrinha azul)
          config_theme: dark
